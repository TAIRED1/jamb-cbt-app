name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Capacitor Add Android
      run: npx cap add android

    - name: Apply App Icon
      run: |
        IMG_PATH="public/icon.png"
        for dir in android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp "$IMG_PATH" "$dir/ic_launcher.png"
            cp "$IMG_PATH" "$dir/ic_launcher_round.png"
            cp "$IMG_PATH" "$dir/ic_launcher_foreground.png"
          fi
        done
        rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
        rm -rf android/app/src/main/res/mipmap-anydpi-v26/
        echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0B111A</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml
        echo "App icon successfully applied."

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TAIRED_JAMB_CBT_2026_2027.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
